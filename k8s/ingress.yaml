# Gracefy Ingress Configuration
# Load balancer and SSL termination
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gracefy-ingress
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # SSL configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Sticky sessions (for WebSocket support)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "gracefy-session"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # Health checks
    nginx.ingress.kubernetes.io/healthcheck-path: "/api/health"
    
    # Compression
    nginx.ingress.kubernetes.io/configuration-snippet: |
      gzip on;
      gzip_types text/plain application/json application/javascript text/css;
      gzip_min_length 1000;
    
    # Certificate (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.gracefy.com
    - gospel-audio.preview.emergentagent.com
    secretName: gracefy-tls
  rules:
  - host: api.gracefy.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gracefy-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gracefy-frontend
            port:
              number: 80
  - host: gospel-audio.preview.emergentagent.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gracefy-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gracefy-frontend
            port:
              number: 80

---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gracefy-network-policy
spec:
  podSelector:
    matchLabels:
      app: gracefy-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8001
  # Allow from other pods in same namespace
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8001
  egress:
  # Allow to MongoDB
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017
  # Allow to Redis
  - to:
    - podSelector:
        matchLabels:
          app: gracefy-redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow to RabbitMQ
  - to:
    - podSelector:
        matchLabels:
          app: gracefy-rabbitmq
    ports:
    - protocol: TCP
      port: 5672
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow external HTTPS (CDN, payment gateways, etc.)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
